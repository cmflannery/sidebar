[package]
name = "sidebar"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Local MCP server for inter-agent messaging and scheduling."
license = "MIT"
repository = "https://github.com/cmflannery/sidebar"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"

rmcp = { version = "1", features = ["server", "transport-io", "macros"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow a few pedantic lints that are too noisy in practice:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"   # noisy on brand names (SQLite, MCP, NDJSON, ...)
